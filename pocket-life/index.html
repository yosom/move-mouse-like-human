<div class="sheet">
<header><h1 id="parentTitle">原作动作 · 小小生活 · 家长设置</h1><button class="close" id="closeParents" aria-label="关闭家长设置">×</button></header>
<p>只有一个主角。它会自己吃东西、出门、游泳、爬山、遇见朋友，再回家。孩子的触摸是陪伴，不是照顾任务。</p>
<label class="setting"><span>一个虚拟昼夜</span><select id="dayLength" aria-label="虚拟昼夜的前台运行时长"><option value="30">30 分钟</option><option value="60" selected>60 分钟 · 默认</option><option value="120">120 分钟</option></select></label>
<label class="setting"><span>轻柔环境动画</span><input type="checkbox" id="quiet"></label>
<p class="note">轻点人物打招呼；按住或来回摸会有不同回应。物件可以点、拖、拨、按。手指松开后，小人会继续生活。轻点睡着的小人可以温和唤醒。</p>
<p class="note">昼夜长度不是建议孩子连续游玩的时长。随时结束；切到后台暂停，不扣离线需求。设置是长按入口，不属于经过认证的家长门禁。</p>

<script>

 open(){this.opened=true;this.input.cancel();this.g.paused=true;PL.Store.write(this.g);this.dialog.hidden=false;this.button.setAttribute('aria-expanded','true');this.status.textContent=PL.Store.message;document.getElementById('resetConfirm').hidden=true;document.getElementById('closeParents').focus();}
 close(){this.opened=false;this.dialog.hidden=true;this.g.paused=false;this.button.setAttribute('aria-expanded','false');PL.Store.write(this.g);this.button.focus();}
};

</script>
<script>
/* src/main.js */
'use strict';
(()=>{const canvas=document.getElementById('world'),game=new PL.Game(),renderer=new PL.Renderer(canvas),audio=new PL.Audio();const saved=PL.Store.read();if(saved)game.restore(saved);else game.settings.quiet=globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;const input=new PL.Input(canvas,game,audio),ui=new PL.ParentUI(game,audio,input);let last=performance.now(),lastSave=game.t,hidden=document.hidden;
 const render=()=>renderer.render(game);
 const frame=now=>{let dt=Math.max(0,Math.min(.2,(now-last)/1000));last=now;if(!hidden){while(dt>1e-7){const step=Math.min(.05,dt);input.update(step);game.update(step);dt-=step;}render();if(game.soundEvent){audio.play(game.soundEvent);game.soundEvent=null;}if(game.t-lastSave>12){PL.Store.write(game);lastSave=game.t;}}requestAnimationFrame(frame);};
 document.addEventListener('visibilitychange',()=>{hidden=document.hidden;renderer.characters.setPaused(hidden||game.paused);last=performance.now();input.cancel();ui.stopHold();if(hidden)PL.Store.write(game);});window.addEventListener('resize',()=>input.cancel());window.addEventListener('pagehide',()=>{input.cancel();PL.Store.write(game);});window.addEventListener('blur',()=>{input.cancel();ui.stopHold();});
 // Inspection only: no additional child-facing controls or separate implementation.
 globalThis.PocketLife={version:9,game,renderer,input,ui,audio,render,advance(seconds){if(!Number.isFinite(seconds)||seconds<0||seconds>86400)throw Error('Invalid simulation duration');const paused=game.paused;game.paused=false;for(let left=seconds;left>1e-7;left-=.05){input.update(.05);game.update(Math.min(.05,left));}game.paused=paused;render();return game.snapshot();}};
 render();requestAnimationFrame(frame);
})();
